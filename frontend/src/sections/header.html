<header id="header-section">
  <div class="header-brand">
    <!-- The adjacent Morrow text names the brand, so the logo has an empty alt. -->
    <img src="/logo.svg" alt="" width="28" height="28" />
    <span>Morrow</span>
  </div>
  <!-- menu.js keeps the toggle state in sync with the controlled navigation. -->
  <button
    id="navigation-toggle"
    type="button"
    aria-controls="navigation"
    aria-expanded="false"
    aria-label="Open navigation"
  >
    <span id="navigation-toggle-icon" aria-hidden="true">☰</span>
  </button>
  <nav id="navigation">
    <ul>
      <li><a href="#hero-section" id="navigation-home">Home</a></li>
      <li><a href="#about-section" id="navigation-about" >About</a></li>
      <li><a href="#services-section" id="navigation-services" >Services</a></li>
      <li><a href="#contact-section" id="navigation-contact" >Contact</a></li>
      <li><a href="#contact-section" id="navigation-start-project" >Start a project -></a></li>
    </ul>
  </nav>
</header>
